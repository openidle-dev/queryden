name: Beta build

# Triggers:
#   - workflow_dispatch: explicit human-driven build. Always runs the full
#     matrix (the `should-build` gate fails open for manual fires).
#   - schedule (03:00 UTC daily): nightly beta build from main. The
#     `should-build` job short-circuits when main has no new commits since
#     the commit `beta-latest` currently points to, so cron at 03:00 UTC
#     doesn't burn the Win/Mac/Linux matrix on idle days. See #140.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build (defaults to main)"
        required: false
        default: "main"
  schedule:
    # 03:00 UTC daily. European morning review window; lower GHA runner
    # contention than 00:00 UTC where most cron workflows fire.
    - cron: "0 3 * * *"

# Default to read-only at the workflow level; the build job inherits this and
# only the `publish` job opts in to `contents: write` (it deletes/recreates the
# `beta-latest` rolling tag and publishes the release).
permissions:
  contents: read

jobs:
  should-build:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Need history + tags to compare main HEAD against the commit
          # `beta-latest` points at. Default checkout is shallow and tagless.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fail-open policy: any non-`schedule` trigger always builds.
          # The user explicitly asked for a build (manual dispatch), or some
          # future trigger we haven't designed around yet — don't silently skip.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Trigger is ${{ github.event_name }} — always build."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled run: skip if main HEAD already matches the commit
          # `beta-latest` points to. Resolves the tag locally if it was
          # fetched, else queries the release API as a fallback.
          HEAD_SHA=$(git rev-parse HEAD)
          LAST_BETA_SHA=""
          if git rev-parse --verify beta-latest >/dev/null 2>&1; then
            LAST_BETA_SHA=$(git rev-parse beta-latest)
          else
            # Tag missing locally (shouldn't happen with fetch-tags: true,
            # but cover the case anyway via the GH API).
            LAST_BETA_SHA=$(gh release view beta-latest \
              --repo ${{ github.repository }} \
              --json targetCommitish -q .targetCommitish 2>/dev/null || true)
          fi

          if [ -z "$LAST_BETA_SHA" ]; then
            echo "No beta-latest reference found — first run, build."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HEAD_SHA" = "$LAST_BETA_SHA" ]; then
            echo "main HEAD ($HEAD_SHA) matches beta-latest ($LAST_BETA_SHA) — skip."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main HEAD ($HEAD_SHA) differs from beta-latest ($LAST_BETA_SHA) — build."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build beta (${{ matrix.platform }})
    needs: should-build
    if: needs.should-build.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          # Artifact-only job — no need to leave a credentialed git remote
          # lying around inside the runner.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - run: npm ci

      - name: Compute beta version
        id: betaver
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(jq -r .version package.json)
          TS=$(date -u +%Y%m%d%H%M%S)
          SHA=$(git rev-parse --short HEAD)
          # SemVer 2.0.0: a pre-release identifier has LOWER precedence than
          # the same normal version, so `1.0.18-beta.X` < `1.0.18`. If we
          # tagged betas with the current stable version, beta users on
          # stable would never receive a beta — the updater would correctly
          # conclude they're already ahead.
          #
          # Strategy: bump the patch component, so betas live in the version
          # space ABOVE the current stable. Example: while stable is 1.0.18,
          # betas are `1.0.19-beta.<ts>+<sha>` and sort `1.0.18 < 1.0.19-beta.X
          # < 1.0.19`. When 1.0.19 ships stable, the next batch of betas
          # rolls to 1.0.20-beta.X.
          #
          # Build metadata (`+<sha>`) is informational only — SemVer says
          # it must be ignored when determining precedence — but two beta
          # builds at the same second would otherwise produce identical
          # version strings, so we keep it.
          NEXT=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number);console.log(\`\${a}.\${b}.\${c+1}\`);" "$BASE")
          BETA="${NEXT}-beta.${TS}+${SHA}"
          echo "version=${BETA}" >> "$GITHUB_OUTPUT"
          echo "Building beta version: ${BETA} (stable base was ${BASE})"

      - name: Stamp beta version into manifests
        shell: bash
        env:
          BETA_VERSION: ${{ steps.betaver.outputs.version }}
        run: |
          set -euo pipefail
          # package.json — use a node one-liner so we don't need yq/jq-edit.
          node -e "const f='package.json';const j=require('./'+f);j.version=process.env.BETA_VERSION;require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n');"
          # tauri.conf.json — same trick.
          node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.version=process.env.BETA_VERSION;require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n');"
          # Cargo.toml is intentionally NOT stamped — keeping its version stable
          # keeps the Cargo.lock hash stable, which lets rust-cache achieve
          # full cache hits. The Tauri-side version (package.json + tauri.conf.json)
          # is what the updater uses; Cargo's version only controls --version output.
          echo "--- package.json ---"; jq .version package.json
          echo "--- tauri.conf.json ---"; jq .version src-tauri/tauri.conf.json

      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Generate SHA256 companion files
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            HASH_CMD="sha256sum"
          else
            HASH_CMD="shasum -a 256"
          fi

          TARGET_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "::warning::Bundle dir $TARGET_DIR not found; skipping checksum step."
            exit 0
          fi

          find "$TARGET_DIR" -type f \
            \( -name '*.deb' -o -name '*.AppImage' \
            -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -print | while IFS= read -r f; do
              $HASH_CMD "$f" | awk '{print $1}' > "$f.sha256"
              echo "Wrote $f.sha256"
            done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beta-bundle-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sha256
          if-no-files-found: warn

  publish:
    name: Publish beta-latest pre-release
    needs: [should-build, build]
    if: needs.should-build.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Only the publish job needs write — it deletes/recreates the rolling
    # `beta-latest` tag and creates the release. Build inherits the
    # workflow-level read-only default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name "*.deb" -o -name "*.AppImage" \
            -o -name "*.exe" -o -name "*.msi" \
            -o -name "*.dmg" -o -name "*.app.tar.gz" \
            -o -name "*.sig" -o -name "*.sha256" \
          \) -exec cp {} release/ \;
          ls -la release

      - name: Compute beta version (publish-side mirror)
        id: betaver
        shell: bash
        run: |
          set -euo pipefail
          # Recompute from package.json on main, with the same recipe the
          # build job used. We can't easily pass values between jobs, but
          # the artifact filenames already embed the version, so the
          # manifest's version field is the only thing we need to derive.
          BASE=$(jq -r .version package.json)
          # The version we want is whatever the artifacts were built with.
          # Read it from any bundle that includes it in its filename.
          # NSIS: QueryDen_<version>_x64-setup.exe
          PROBE=$(ls release/*_x64-setup.exe 2>/dev/null | head -1 || true)
          if [ -n "$PROBE" ]; then
            BETA=$(basename "$PROBE" | sed -E 's/^QueryDen_([^_]+)_x64-setup\.exe$/\1/')
          else
            # Fallback: read from AppImage filename QueryDen_<version>_amd64.AppImage
            PROBE=$(ls release/*.AppImage 2>/dev/null | head -1 || true)
            if [ -n "$PROBE" ]; then
              BETA=$(basename "$PROBE" | sed -E 's/^QueryDen_([^_]+)_.*\.AppImage$/\1/')
            else
              BETA="${BASE}-beta.unknown"
            fi
          fi
          echo "version=${BETA}" >> "$GITHUB_OUTPUT"
          echo "Publishing beta manifest for: ${BETA}"

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        env:
          BETA_VERSION: ${{ steps.betaver.outputs.version }}
        run: |
          set -euo pipefail
          # Pull everything between `## [Unreleased]` and the next `## [`
          # version header out of CHANGELOG.md. This becomes the notes payload
          # for both the GitHub release body and beta.json's `notes` field —
          # so the in-app updater can show users what's actually in the build
          # instead of a generic "see commits on main" placeholder. See #143.
          UNRELEASED=$(awk '
            /^## \[Unreleased\]/ { flag=1; next }
            /^## \[/             { flag=0 }
            flag
          ' CHANGELOG.md)

          # An empty Unreleased block (or one with only `### Fixed` / `### Added`
          # section headers but no entries) is not useful. Detect this by
          # stripping blank lines and `### `-prefixed lines and checking
          # whether anything substantive remains.
          MEANINGFUL=$(echo "$UNRELEASED" | grep -v -E '^\s*$' | grep -v -E '^###' || true)

          if [ -n "$MEANINGFUL" ]; then
            BODY="$UNRELEASED"
            echo "Using CHANGELOG.md [Unreleased] section."
          else
            echo "[Unreleased] block is empty — falling back to git log since beta-latest."
            git fetch origin "refs/tags/beta-latest:refs/tags/beta-latest" 2>/dev/null || true
            if git rev-parse --verify beta-latest >/dev/null 2>&1; then
              COMMITS=$(git log --format='- %s' beta-latest..HEAD)
            else
              COMMITS=$(git log --format='- %s' -n 20 HEAD)
            fi
            if [ -z "$COMMITS" ]; then
              BODY="_No changes since the last beta build._"
            else
              BODY=$(printf "### Recent commits\n\n%s\n" "$COMMITS")
            fi
          fi

          # Manifest notes: just the body — this is what the updater dialog
          # surfaces to opted-in beta users.
          printf "%s\n" "$BODY" > release-notes-manifest.md

          # Release body: prepend the rolling-tag disclaimer so anyone landing
          # on the GitHub release page knows what they're looking at.
          {
            printf "Rolling beta channel. This tag/release is recreated on every successful beta build — the URL \`beta-latest\` is what the in-app updater points at when the user opts into the beta channel.\n\n"
            printf "**Do not** treat this like a versioned release: contents are replaced without notice. The \`version\` field inside \`beta.json\` is the source of truth for what's currently published.\n\n"
            printf "**Version:** \`%s\`\n\n" "$BETA_VERSION"
            # Use '%s' so the leading "---" isn't parsed by printf as options
            # (bash printf treats "---\n\n" as flags → "printf: --: invalid option").
            printf '%s\n\n' "---"
            printf "## Changes\n\n"
            cat release-notes-manifest.md
          } > release-notes-body.md

          echo "::group::beta.json notes"
          cat release-notes-manifest.md
          echo "::endgroup::"
          echo "::group::GitHub release body"
          cat release-notes-body.md
          echo "::endgroup::"

      - name: Generate beta.json (tauri-plugin-updater manifest)
        shell: bash
        env:
          BETA_VERSION: ${{ steps.betaver.outputs.version }}
        run: |
          set -euo pipefail
          # The manifest lives on the moving tag `beta-latest` so the URL
          # stays stable across builds. The bundle URLs point at the same
          # release.
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/beta-latest"

          first() { ls release/$1 2>/dev/null | head -1 || true; }

          PLATFORMS='{}'

          WIN_EXE=$(first '*_x64-setup.exe')
          WIN_SIG=$(first '*_x64-setup.exe.sig')
          if [ -n "$WIN_EXE" ] && [ -n "$WIN_SIG" ]; then
            PLATFORMS=$(jq \
              --arg sig "$(cat "$WIN_SIG")" \
              --arg url "$BASE_URL/$(basename "$WIN_EXE")" \
              '. + {"windows-x86_64": {signature: $sig, url: $url}}' <<<"$PLATFORMS")
          fi

          # Tauri's macOS update bundle is named `QueryDen.app.tar.gz`
          # — no architecture in the filename. We only build one macOS
          # target today (aarch64), so a wildcard without arch is safe
          # and correct. The old `*aarch64.app.tar.gz` glob silently
          # dropped macOS from beta.json (see #112).
          MAC_TGZ=$(first '*.app.tar.gz')
          MAC_SIG=$(first '*.app.tar.gz.sig')
          if [ -n "$MAC_TGZ" ] && [ -n "$MAC_SIG" ]; then
            PLATFORMS=$(jq \
              --arg sig "$(cat "$MAC_SIG")" \
              --arg url "$BASE_URL/$(basename "$MAC_TGZ")" \
              '. + {"darwin-aarch64": {signature: $sig, url: $url}}' <<<"$PLATFORMS")
          fi

          LINUX_APP=$(first '*.AppImage')
          LINUX_SIG=$(first '*.AppImage.sig')
          if [ -n "$LINUX_APP" ] && [ -n "$LINUX_SIG" ]; then
            PLATFORMS=$(jq \
              --arg sig "$(cat "$LINUX_SIG")" \
              --arg url "$BASE_URL/$(basename "$LINUX_APP")" \
              '. + {"linux-x86_64": {signature: $sig, url: $url}}' <<<"$PLATFORMS")
          fi

          jq -n \
            --arg version "$BETA_VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes release-notes-manifest.md \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > release/beta.json

          echo "::group::beta.json"
          cat release/beta.json
          echo "::endgroup::"

      - name: Move beta-latest tag and recreate pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Delete previous beta-latest release + tag so we can recreate
          # cleanly. `gh release delete --cleanup-tag` removes both. The
          # `|| true` lets the first run succeed when nothing exists yet.
          gh release delete beta-latest --yes --cleanup-tag --repo ${{ github.repository }} || true

      - name: Create beta-latest pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: beta-latest
          name: "Beta (rolling)"
          prerelease: true
          fail_on_unmatched_files: true
          body_path: release-notes-body.md
          files: release/*
